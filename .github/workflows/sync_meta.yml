name: Daily TFT Meta Sync (15:00 JST)

on:
  schedule:
    # 毎日 UTC 06:00 (日本時間 15:00) に自動実行
    - cron: '0 6 * * *'
  # GitHub画面から手動テスト実行もできるように設定
  workflow_dispatch:

jobs:
  sync-meta:
    runs-on: ubuntu-latest

    permissions:
      contents: write # GitHubへの自動pushを許可

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 全自動メタ更新スクリプトの実行
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python scripts/update_all_meta.py

      - name: 変更差分があれば自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "データに変更はありませんでした。"
          else
            git commit -m "chore: auto-sync daily meta stats [skip ci]"
            git push
          fi